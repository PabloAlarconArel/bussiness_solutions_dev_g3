<!doctype html>
<html lang="en">
	<head>
        {% load static %}
		<!-- Required meta tags -->
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<!-- Bootstrap CSS -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <!-- Boxicons -->
        <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel='stylesheet'>

		<title>Estacionamientos</title>

		<style>
		body {
		  font-family: "Lato", sans-serif;
		}
		
		.sidenav {
		  height: 100%;
		  width: 0;
		  position: fixed;
		  z-index: 1;
		  top: 0;
		  left: 0;
		  overflow-x: hidden;
		  transition: 0.5s;
		  padding-top: 60px;
		}
		
		.sidenav a {
		  padding: 8px 8px 8px 32px;
		  text-decoration: none;
		  font-size: 25px;
		  color: #000000;
		  display: block;
		  transition: 0.4s;
		}
		
		.sidenav a:hover {
		  color: #000000;
		}
		
		.sidenav .closebtn {
		  position: absolute;
		  top: 0;
		  right: 25px;
		  font-size: 36px;
		  margin-left: 50px;
		}
		
		#main {
		  transition: margin-left .5s;
		  padding: 16px;
		}
		
		@media screen and (max-height: 450px) {
		  .sidenav {padding-top: 15px;}
		  .sidenav a {font-size: 18px;}
		}
		</style>
	<div id="main">
		<nav class="navbar sticky-top navbar-expand-lg navbar-light bg-light">
			<div class="container-fluid">
				<span onclick="openNav()"><i class='bx bx-menu bx-lg'></i></span>
				<div class="collapse navbar-collapse" id="navbarText">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0" style="font-size: 25px;color: black;">
						{% block head %}
						{% endblock %}
					</ul>
					<span class="navbar-text" style="font-size: 25px;color: black;">Sucursal</span>
				</div>
			</div>
		</nav>	
		&nbsp;
		{% block content %}
		  
		{% endblock %}
	</div>
</head>
<body>
	<div id="mySidenav" class="sidenav bg-light">
		<a><span>{{user.username}}</span></a>
		<a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
		<a href="{% url 'dashboard' %}">
			<i class='bx bxs-dashboard'>&nbsp;Dashboard</i>
		</a>
		<a href="{% url 'reservas' %}">
			<i class='bx bx-book-bookmark'>&nbsp;Reservas</i>
		</a>
		<a href="{% url 'accesos' %}">
			<i class='bx bx-horizontal-center'>&nbsp;Accesos</i>
		</a>
		<a href="{% url 'estacionamiento_list' %}">
			<i class='bx bxs-parking'>&nbsp;Parking</i>
		</a>
		<a href="{% url 'home' %}">
			<i class='bx bx-log-out' >&nbsp;Logout</i>
		</a>
	</div>
	
	<script>
	function openNav() {
		document.getElementById("mySidenav").style.width = "200px";
		document.getElementById("main").style.marginLeft = "200px";
	}
	
	function closeNav() {
		document.getElementById("mySidenav").style.width = "0";
		document.getElementById("main").style.marginLeft= "0";
	}
	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
