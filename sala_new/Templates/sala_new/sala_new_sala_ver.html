{% extends 'sucursales/sucursales_menu.html' %}
{% load static %}
{% block title %}{% endblock %}
{% block content %}
    {% block extra_css %}    
    {% endblock extra_css %}    
    <header class='mb-4'>
        <h2 class='h2 medium text-blue'>Editar Sala</h2>
    </header>
    <div class="col-md-11">
        <div class="mb-3">
            <div class="d-flex flex-column align-items-center align-items-lg-start">
                <form method="post" action="{% url 'sala_new_sala_update' %}">
                    {% csrf_token %}
                    <div class="col-12 col-lg-12 row row-cols-1 row-cols-md-1 g-2 p-lg-0-5">
                        <div class="mb-0 col-md-12">
                            <label for="category_name" class="form-label">ID Piso</label>
                            <input type="text" class="form-control" name="id" id="id" value="{{sala_data.id}}" placeholder="" readonly>
                            <div class="feedback body--small normal"></div>
                        </div>
                        <br>
                        <div class="mb-0 col-md-12">
                            <label for="category_name" class="form-label">Nombre</label>
                            <input type="text" class="form-control" name="nombre_sala" id="nombre_sala" value="{{sala_data.nombre_sala}}" placeholder="Nombre Sala Reuniones" required>
                            <div class="feedback body--small normal"></div>
                        </div>
                        <br>
                        <div class="mb-0 col-md-12">
                            <label for="category_description" class="form-label">Capacidad</label>
                            <input type="text" class="form-control" name="capacidad_sala" id="capacidad_sala" value="{{sala_data.capacidad_sala}}" placeholder="Capacidad Sala Reuniones" required>
                            <div class="feedback body--small normal"></div>
                        </div>
                        <br>
                        <div class="mb-0 col-md-12">
                            <div class="d-flex justify-content-center mb-2">
                                <div class="d-flex justify-content-center mx-0-5--custom">
                                    <button type="submit" class="button">Editar</button>
                                </div>
                                <div class="d-flex justify-content-center mx-0-5--custom">
                                    <br>
                                    <a href="{% url 'sala_new_list_sala_new' %}" class="button">Regresa</a>
                                </div>  
                            </div>                                  
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% block extrajs %}    
    {% endblock extrajs %}    
{% endblock %}
